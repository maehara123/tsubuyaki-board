<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿詳細 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>投稿詳細</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
    </nav>

    <article class="post">
        <header>
            <span th:if="${post.avatarColor}"
                  class="post__avatar"
                  th:classappend="| post__avatar--${post.avatarColor}|"
                  aria-hidden="true"></span>
            <span class="post__author" th:text="${post.author}">投稿者</span>
        </header>
        <p class="post__body" th:text="${post.body}">本文</p>
        <time class="post__created-at"
              th:datetime="${post.createdAt}"
              th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
        <div class="post__likes">
            <span th:text="|いいね ${likeCount}|">いいね 0</span>
            <form th:action="@{/posts/{id}/likes(id=${post.id})}" method="post">
                <button class="like-toggle"
                        th:classappend="${liked} ? ' like-toggle--on'"
                        type="submit"
                        aria-label="Likeを切り替える"
                        th:attr="aria-pressed=${liked}">
                    <span class="like-toggle__track" aria-hidden="true">
                        <span class="like-toggle__thumb"></span>
                    </span>
                    <span class="like-toggle__text">Like</span>
                </button>
            </form>
        </div>
        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
            <button class="post__delete-button" type="submit">削除</button>
        </form>
    </article>
</main>
</body>
</html>
